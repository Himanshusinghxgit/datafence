# Example DataFence policies for Langflow customer service bot

policies:
  # Allow customer service agents to read customer data
  - actor: "agent:customer_service"
    resource: "customers"
    operation: "read"
    effect: "allow"
    description: "Customer service can view customer information"
    
    # Only show specific fields
    field_restrictions:
      allow:
        - id
        - name
        - email
        - phone
        - account_status
        - created_at
      
      # Redact sensitive fields with *** 
      redact:
        - ssn
        - date_of_birth
      
      # Completely block these fields
      deny:
        - credit_card
        - password_hash
        - internal_notes
    
    # Only show active customers
    row_restrictions:
      - field: "account_status"
        operator: "equals"
        value: "active"

  # Allow order lookups
  - actor: "agent:customer_service"
    resource: "orders"
    operation: "read"
    effect: "allow"
    description: "Customer service can view orders"
    
    field_restrictions:
      allow:
        - order_id
        - customer_id
        - order_date
        - status
        - total_amount
      redact:
        - payment_method_details
      deny:
        - payment_token

  # Block write operations
  - actor: "agent:customer_service"
    resource: "*"
    operation: "update"
    effect: "deny"
    description: "Customer service cannot update records"
    reasons:
      - "Write operations not allowed for customer service agents"

  - actor: "agent:customer_service"
    resource: "*"
    operation: "delete"
    effect: "deny"
    description: "Customer service cannot delete records"
    reasons:
      - "Delete operations not allowed for customer service agents"

  # Multi-tenant isolation example
  - actor: "agent:*"
    resource: "customers"
    operation: "read"
    effect: "allow"
    description: "Tenant isolation for customers"
    
    row_restrictions:
      - field: "tenant_id"
        operator: "equals"
        value_from: "context.actor.tenant_id"

  # Admin has full access
  - actor: "agent:admin"
    resource: "*"
    operation: "*"
    effect: "allow"
    description: "Admins have full access"

# PII detection patterns
pii_patterns:
  - name: "SSN"
    pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    action: "redact"
  
  - name: "Credit Card"
    pattern: "\\b\\d{4}[\\s-]?\\d{4}[\\s-]?\\d{4}[\\s-]?\\d{4}\\b"
    action: "redact"
  
  - name: "Email"
    pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
    action: "detect"  # Only detect, don't redact

# SQL firewall rules
sql_firewall:
  block_patterns:
    - "(?i)DROP\\s+TABLE"
    - "(?i)DROP\\s+DATABASE"
    - "(?i);.*--"
    - "(?i)UNION\\s+SELECT"
    - "(?i)1\\s*=\\s*1"
    - "(?i)OR\\s+1\\s*=\\s*1"
  
  max_query_length: 1000
  
  allowed_operations:
    - "SELECT"
    - "INSERT"
    - "UPDATE"
    - "DELETE"
