# docker-compose for local DataFence API development.
#
# This runs the DataFence authorization API image only.
# DataFence does NOT own a database — your application connector owns that.
# Add your own database service to this compose file when integrating.
#
# Usage:
#   docker-compose up --build
#
# The default CMD prints CLI help.  Override with your application entrypoint:
#   command: ["uvicorn", "my_app.main:app", "--host", "0.0.0.0", "--port", "8000"]

version: '3.8'

services:
  datafence:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./policies:/app/policies:ro
    environment:
      # Application-supplied configuration — replace with real values or
      # mount secrets via a secrets manager.
      - DATAFENCE_SIGNING_KEY_FILE=/run/secrets/signing_key
      - LOG_LEVEL=INFO
    # Override CMD with your application server entrypoint.
    # Example: command: ["uvicorn", "my_app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
