# Kubernetes Secrets (base64 encoded)
# NOTE: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
---
apiVersion: v1
kind: Secret
metadata:
  name: datafence-db-credentials
  namespace: datafence
  labels:
    app: datafence
type: Opaque
stringData:
  host: "postgres.database.svc.cluster.local"
  database: "datafence"
  username: "datafence"
  password: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: Secret
metadata:
  name: datafence-api-keys
  namespace: datafence
  labels:
    app: datafence
type: Opaque
stringData:
  api-key: "CHANGE_ME_IN_PRODUCTION"
