# ConfigMap for DataFence policy
apiVersion: v1
kind: ConfigMap
metadata:
  name: datafence-policy
  namespace: datafence
  labels:
    app: datafence
data:
  policy.yaml: |
    version: "1"
    policy:
      name: production-policy
      description: Production DataFence policy
      
      resources:
        transactions:
          operations:
            allow: [read]
            deny: [insert, update, delete]
          
          fields:
            allow:
              - id
              - customer_id
              - amount
              - merchant
              - timestamp
            deny:
              - card_number
              - cvv
              - account_number
          
          row_filters:
            tenant_id: "{{ actor.tenant_id }}"
          
          limits:
            max_rows: 1000
            max_date_range_days: 90
