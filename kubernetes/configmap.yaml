# ConfigMap for a DataFence authorization policy.
# Mount this into the application container and load it via YAMLPolicyLoader.
#
# Policy YAML syntax reference:
#   resources.<name>.actions.read: allow | deny
#   resources.<name>.fields.allow: [field, ...]
#   resources.<name>.fields.deny:  [field, ...]
#   resources.<name>.fields.filterable: [field, ...]   # explicit filter authorization
#   resources.<name>.rows:
#     - field: tenant_id
#       operator: equals
#       value: ":actor_tenant_id"           # resolved from Principal at request time
#   resources.<name>.limits.rows: N
#   resources.<name>.obligations:
#     audit: true
#
# Note: Row rule values use :actor_tenant_id (not {{ actor.tenant_id }}).

apiVersion: v1
kind: ConfigMap
metadata:
  name: datafence-policy
  namespace: datafence
  labels:
    app: datafence
data:
  policy.yaml: |
    name: production-policy
    version: "1.0"

    resources:
      transactions:
        actions:
          read: allow

        fields:
          allow:
            - id
            - tenant_id
            - customer_id
            - amount
            - merchant
            - timestamp
          deny:
            - card_number
            - cvv
            - account_number
          filterable:
            - tenant_id
            - merchant
            - timestamp

        rows:
          - field: tenant_id
            operator: equals
            value: ":actor_tenant_id"

        limits:
          rows: 1000

        obligations:
          audit: true
