# Kubernetes Deployment for a DataFence authorization API.
#
# This manifest deploys the DataFence image.  Your application entrypoint
# (supplied via CMD override or a ConfigMap-mounted script) must:
#   1. Build DataFenceBoundary with a policy loaded from /app/policies/policy.yaml
#   2. Supply a principal_resolver that validates Bearer tokens
#   3. Call datafence.api.create_api(boundary, principal_resolver) and serve it
#
# DataFence does NOT own a database.  Remove or replace the DB env vars below
# with whatever your application connector needs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: datafence-api
  namespace: datafence
  labels:
    app: datafence
    component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: datafence
      component: api
  template:
    metadata:
      labels:
        app: datafence
        component: api
    spec:
      serviceAccountName: datafence
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: datafence-api
        image: datafence/datafence-api:0.1.0
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        env:
        # Signing key must be supplied by the application — never hardcode it.
        - name: DATAFENCE_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: datafence-signing-key
              key: signing-key

        volumeMounts:
        - name: policy-config
          mountPath: /app/policies/policy.yaml
          subPath: policy.yaml
          readOnly: true

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        # The DataFence API exposes /health (not /healthz or /ready).
        # Override these paths if your application layer adds /healthz and /ready.
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      volumes:
      - name: policy-config
        configMap:
          name: datafence-policy
