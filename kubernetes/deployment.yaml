# Kubernetes Deployment for DataFence API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datafence-api
  namespace: datafence
  labels:
    app: datafence
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: datafence
      component: api
  template:
    metadata:
      labels:
        app: datafence
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: datafence
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: datafence-api
        image: datafence/datafence-api:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        env:
        - name: DATAFENCE_POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: datafence-db-credentials
              key: host
        - name: DATAFENCE_POSTGRES_PORT
          value: "5432"
        - name: DATAFENCE_POSTGRES_DATABASE
          valueFrom:
            secretKeyRef:
              name: datafence-db-credentials
              key: database
        - name: DATAFENCE_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: datafence-db-credentials
              key: username
        - name: DATAFENCE_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datafence-db-credentials
              key: password
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: datafence-api-keys
              key: api-key
        
        volumeMounts:
        - name: policy-config
          mountPath: /app/policy.yaml
          subPath: policy.yaml
          readOnly: true
        - name: logs
          mountPath: /app/logs
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: policy-config
        configMap:
          name: datafence-policy
      - name: logs
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - datafence
              topologyKey: kubernetes.io/hostname
