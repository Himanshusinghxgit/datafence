# GitHub Actions CI for DataFence
name: CI

on:
  push:
    branches: [main, hardening]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Lint + type check
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check src tests examples

      - name: ruff format check
        run: python -m ruff format --check src tests examples

      - name: mypy
        run: python -m mypy src/datafence/core

  # ─────────────────────────────────────────────────────────────────────
  # Unit + security invariant tests (multi-version matrix)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: python -m pytest tests/ -q --cov=datafence --cov-report=xml

      - name: Run v0.1 security attack regression
        run: python attacks/verify_v01_blocks_attacks.py

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  # ─────────────────────────────────────────────────────────────────────
  # Policy validation
  # ─────────────────────────────────────────────────────────────────────
  validate-policies:
    name: Validate Policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[cli]"

      - name: Validate all built-in policies
        run: |
          for policy in policies/*.yaml; do
            echo "Validating $policy ..."
            datafence validate "$policy" || exit 1
          done

  # ─────────────────────────────────────────────────────────────────────
  # Package build + wheel boundary check
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build wheel + boundary check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Inspect wheel — must not contain legacy or DB code
        run: |
          echo "Wheel contents:"
          unzip -l dist/*.whl

          echo "Checking for forbidden paths..."
          unzip -l dist/*.whl | grep -E "_legacy|memory_connector|postgres|athena|snowflake|sqlite" \
            && echo "FORBIDDEN content found in wheel!" && exit 1 \
            || echo "Wheel boundary: CLEAN"

      - name: Smoke test — clean install
        run: |
          python -m venv /tmp/clean_venv
          /tmp/clean_venv/bin/pip install dist/*.whl
          /tmp/clean_venv/bin/python -c "
          from secrets import token_bytes
          from datafence import (
              Principal, DataFenceBoundary, DataFencePolicyEngine, DataFencePolicy,
              ResourceDefinition, FieldDefinition, ResourceRegistry, ResourcePolicy,
              ActionDecision, RowRule, Intent, Operation, CapabilityToken, CapabilityVerifier,
          )
          from datafence.core.resources import PredicateOperator

          reg = ResourceRegistry()
          reg.register(ResourceDefinition('items', fields={
              'id': FieldDefinition('id', 'integer'),
              'tenant_id': FieldDefinition('tenant_id', 'string', is_tenant_key=True),
          }, supported_operations=('read',)))
          pol = DataFencePolicy('smoke', '1', {'items': ResourcePolicy('items',
              actions={'read': ActionDecision.ALLOW},
              allowed_fields=['id', 'tenant_id'],
              row_rules=[RowRule('tenant_id', PredicateOperator.EQ, ':actor_tenant_id')],
              max_rows=10,
          )})
          engine = DataFencePolicyEngine(pol, registry=reg)
          key = token_bytes(32)
          b = DataFenceBoundary.create(engine, reg, key, capability_audience='smoke')
          cap = b.authorize(Principal('u', 't'), Intent('items', Operation.READ))
          token = CapabilityToken.encode(cap)
          CapabilityVerifier(key, expected_audience='smoke').verify_token(token)
          print('Smoke test: PASSED')
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
