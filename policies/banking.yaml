name: banking-demo-v1
version: "1.0"

resources:
  transactions:
    actions:
      read: allow
      insert: deny
      update: deny
      delete: deny
    fields:
      allow:
        - id
        - merchant
        - amount
        - timestamp
      deny:
        - card_number
        - account_number
    rows:
      - field: tenant_id
        operator: equals
        value: ":actor_tenant_id"
    limits:
      rows: 100
    obligations:
      audit: true

  customers:
    actions:
      read: allow
      insert: deny
      update: deny
      delete: deny
    fields:
      allow:
        - id
        - name
        - email
      deny:
        - ssn
        - account_number
    rows:
      - field: tenant_id
        operator: equals
        value: ":actor_tenant_id"
    limits:
      rows: 100

  accounts:
    actions:
      read: deny
      insert: deny
      update: deny
      delete: deny
    fields:
      allow: []
      deny:
        - account_number
        - balance
    limits:
      rows: 0
