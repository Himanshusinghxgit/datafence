version: "1"

policy:
  name: banking-transactions
  
  resources:
    transactions:
      operations:
        allow:
          - read
        deny:
          - insert
          - update
          - delete
      
      fields:
        allow:
          - transaction_id
          - customer_id
          - merchant
          - amount
          - currency
          - timestamp
          - category
        deny:
          - card_number
          - cvv
          - account_number
          - full_account_number
      
      row_filters:
        customer_id: "{{ actor.customer_id }}"
      
      limits:
        max_rows: 1000
        max_date_range_days: 90
    
    accounts:
      operations:
        allow:
          - read
        deny:
          - insert
          - update
          - delete
      
      fields:
        allow:
          - account_id
          - customer_id
          - account_type
          - balance
          - currency
          - status
        deny:
          - account_number
          - routing_number
          - ssn
      
      row_filters:
        customer_id: "{{ actor.customer_id }}"
      
      limits:
        max_rows: 100
