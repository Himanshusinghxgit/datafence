[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datafence"
version = "1.0.0"
description = "A deterministic authorization and execution boundary for AI agents accessing data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "DataFence Contributors"}
]
keywords = ["security", "ai", "llm", "data-governance", "policy-engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sqlparse>=0.4.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]>=3.1.0",
]
athena = [
    "boto3>=1.28.0",
    "pyathena>=3.0.0",
]
snowflake = [
    "snowflake-connector-python>=3.0.0",
]
integrations = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
]
cli = [
    "click>=8.0.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
all = [
    "psycopg[binary,pool]>=3.1.0",
    "boto3>=1.28.0",
    "pyathena>=3.0.0",
    "snowflake-connector-python>=3.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
    "click>=8.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
]

[project.scripts]
datafence = "datafence.cli:main"

[project.urls]
Homepage = "https://github.com/Himanshusinghxgit/datafence"
Documentation = "https://github.com/Himanshusinghxgit/datafence#readme"
Repository = "https://github.com/Himanshusinghxgit/datafence"
Issues = "https://github.com/Himanshusinghxgit/datafence/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "src/datafence/_legacy",
    "tests/manual",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
exclude = '(?x)^src/datafence/(?:_legacy|api\.py|audit|integrations|mcp|monitoring|optimization\.py|provenance|security|cli\.py)'
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=datafence --cov-report=term-missing"
