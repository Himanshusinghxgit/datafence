[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datafence"
version = "1.0.0"
description = "Deterministic authorization boundary for AI agents accessing enterprise data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "DataFence Contributors"}
]
keywords = ["security", "ai", "llm", "data-governance", "policy-engine", "authorization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core only requires PyYAML (for optional YAML policy loading).
# No database drivers. No HTTP frameworks. No ML libraries.
# DataFence is an authorization library — it does not execute data.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
cli = [
    "click>=8.0.0",
]
integrations = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
]

[project.scripts]
datafence = "datafence.cli:main"

[project.urls]
Homepage = "https://github.com/Himanshusinghxgit/datafence"
Documentation = "https://github.com/Himanshusinghxgit/datafence#readme"
Repository = "https://github.com/Himanshusinghxgit/datafence"
Issues = "https://github.com/Himanshusinghxgit/datafence/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "tests/manual",
    "attacks",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
exclude = '(?x)^src/datafence/(?:api\.py|integrations|mcp|cli\.py)'
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["manual"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=datafence --cov-report=term-missing"
